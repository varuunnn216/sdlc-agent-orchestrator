name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: ruff check api agent mcp_server evals tests scripts
      - name: Run pytest
        run: pytest -v

  node-sample-app-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test and build sample-app
        run: |
          cd sample-app
          npm ci
          npm test
          npm run build
      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build
