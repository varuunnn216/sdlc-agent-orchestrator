services:
  - type: web
    name: sdlc-agent-orchestrator-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: ALLOW_REAL_PR
        value: "false"
      - key: LLM_PROVIDER_ORDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
